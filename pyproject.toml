[project]
name = "audiototext"
version = "0.1.0"
description = "Audio transcription using open source and OpenAI models"
authors = [
    { name = "Oivind Thorsen Kulsrud", email = "oivind.thorsen.kulsrud@nav.no" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai==0.28",
    "pydub>=0.25.1,<0.26.0",
    "pyaudio>=0.2.14,<0.3.0",
    "pyperclip>=1.9.0,<2.0.0",
    "ffmpeg-python>=0.2.0,<0.3.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "faster-whisper>=1.1.1,<2.0.0",
]

[tool.uv]
package = false
